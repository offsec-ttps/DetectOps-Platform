general:
  attack_range_password: changeme123!
  cloud_provider: aws
  attack_range_name: ar
  ip_whitelist: 0.0.0.0/0
  description: AWS deployment with Splunk, Windows Active Directory domain controller, and domain-joined Windows endpoint
aws:
  region: eu-central-1
  aws_default_tags:
    splunkit_environment_type: non-prd
    splunkit_data_classification: private
attack_range:
- name: splunk
  ami_name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
  ami_owner: "099720109477"
  instance_type: t3.xlarge
  ip_last_octet: 10
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_password: changeme123!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: changeme123!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 10.0.2.10
          port: 22
          username: ubuntu
          password: changeme123!
        - name: win-dc
          protocol: rdp
          hostname: 10.0.2.11
          port: 3389
          username: Administrator
          password: changeme123!
        - name: win
          protocol: rdp
          hostname: 10.0.2.12
          port: 3389
          username: Administrator
          password: changeme123!
- name: win-dc
  ami_name_filter: Windows_Server-2022-English-Full-Base-*
  ami_owner: "801119661308"
  instance_type: t3.large
  ip_last_octet: 11
  windows: true
  user_name: Administrator
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10
  - role: P4T12ICK.ar_domain_controller
    vars:
      ar_domain_controller_password: changeme123!
- name: win
  ami_name_filter: Windows_Server-2022-English-Full-Base-*
  ami_owner: "801119661308"
  instance_type: t3.large
  ip_last_octet: 12
  windows: true
  user_name: Administrator
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10
  - role: P4T12ICK.ar_domain_join
    vars:
      ar_domain_join_password: changeme123!
      ar_domain_join_domain_controller_ip: 10.0.2.11
