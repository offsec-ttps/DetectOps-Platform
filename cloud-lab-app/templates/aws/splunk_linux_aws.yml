general:
  attack_range_password: changeme123!
  cloud_provider: aws
  attack_range_name: ar
  ip_whitelist: 0.0.0.0/0
  description: AWS deployment with Splunk and Linux endpoint for testing Linux-based attacks
aws:
  region: eu-central-1
  aws_default_tags:
    splunkit_environment_type: non-prd
    splunkit_data_classification: private
attack_range:
- name: splunk
  ami_name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
  ami_owner: "099720109477"
  instance_type: t3.xlarge
  ip_last_octet: 10
  linux: true
  user_name: ubuntu  
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_password: changeme123!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: changeme123!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 10.0.2.10
          port: 22
          username: ubuntu
          password: changeme123!
        - name: linux
          protocol: ssh
          hostname: 10.0.2.11
          port: 22
          username: ubuntu
          password: changeme123!
- name: linux
  ami_name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
  ami_owner: "099720109477"
  instance_type: t3.large
  ip_last_octet: 11
  linux: true
  user_name: ubuntu  
  roles:
  - role: P4T12ICK.ludus_ar_linux
    vars:
      ludus_ar_linux_splunk_password: changeme123!
      ludus_ar_linux_splunk_ip: 10.0.2.10
