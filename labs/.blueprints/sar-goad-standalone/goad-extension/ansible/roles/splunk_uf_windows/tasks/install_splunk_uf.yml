---
- name: Check if Splunk UF is already installed
  win_stat:
    path: 'C:\Program Files\SplunkUniversalForwarder\bin\splunk.exe'
  register: splunk_uf_check

- name: DNS lookup for Splunk download
  win_command: 'nslookup download.splunk.com'
  register: dns_check
  when: not splunk_uf_check.stat.exists
  ignore_errors: yes

- name: Download Splunk Universal Forwarder
  win_shell: |
    [Net.ServicePointManager]::SecurityProtocol = "tls12, tls11, tls"
    (New-Object System.Net.WebClient).DownloadFile("{{ splunk_uf_win_url }}", "C:\splunkuf.msi")
  when: not splunk_uf_check.stat.exists

- name: Install Splunk Universal Forwarder MSI
  win_package:
    path: 'C:\splunkuf.msi'
    arguments: 'WINEVENTLOG_SEC_ENABLE=0 WINEVENTLOG_SYS_ENABLE=0 WINEVENTLOG_APP_ENABLE=0 SPLUNKPASSWORD={{ splunk_admin_password }} AGREETOLICENSE=YES /quiet'
  when: not splunk_uf_check.stat.exists

- name: Ensure SplunkForwarder service is started
  win_service:
    name: SplunkForwarder
    state: started
    start_mode: auto

- name: Clean up installer
  win_file:
    path: 'C:\splunkuf.msi'
    state: absent
  ignore_errors: yes
