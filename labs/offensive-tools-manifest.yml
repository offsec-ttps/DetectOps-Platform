# Curated list of open-source offensive tools seeded into the Build Forge catalog.
#
# The `scripts/seed-offensive-tools.ts` script reads this file and idempotently
# upserts one BuildRepo row per entry. Safe to re-run.
#
# Fields:
#   owner            GitHub organisation or user
#   repo             GitHub repository name
#   language         Build pipeline key — one of: go | rust | csharp | python | powershell | custom
#   description      One-line summary shown on Build Forge card
#   category         Grouping for UI filter: credential-access | recon | lateral-movement |
#                    post-exploitation | command-and-control | defense-evasion | payload
#   mitre_techniques Array of MITRE ATT&CK technique IDs
#   risk_level       low | medium | high — high-risk tools get a red badge + confirmation
#   default_branch   Optional — defaults to "main" if unset
#
# DEFENSIVE USE ONLY. Every tool here is open-source and widely published.
# This catalog exists so blue teams can build detections against the same
# artifacts attackers use.

tools:
  # ── Credential access ───────────────────────────────────────────────────────
  - owner: GhostPack
    repo: Rubeus
    language: csharp
    description: C# toolkit for raw Kerberos interaction (TGT request, AS-REP roasting, S4U, pass-the-ticket)
    category: credential-access
    mitre_techniques: [T1558.003, T1550.002, T1558.004, T1550.003]
    risk_level: high

  - owner: gentilkiwi
    repo: mimikatz
    language: custom
    description: The canonical Windows credential-dumping tool — LSASS scraping, Kerberos tickets, DCSync
    category: credential-access
    mitre_techniques: [T1003.001, T1003.006, T1550.002, T1558]
    risk_level: high

  - owner: AlessandroZ
    repo: LaZagne
