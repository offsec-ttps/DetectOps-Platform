site_name: DetectOps Docs
site_description: >-
  End-to-end Detection Engineering & Adversary Simulation platform, mapped to
  MITRE ATT&CK — documented section-by-section to mirror the dashboard.
site_author: DetectOps
repo_url: https://github.com/your-org/detection-platform
edit_uri: ""
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Left: collapsible section/subsection tree that mirrors the dashboard.
    - navigation.indexes      # a section header is itself a clickable landing page
    - navigation.top          # back-to-top button
    - navigation.instant      # SPA-style navigation
    - navigation.instant.progress
    - navigation.footer       # prev/next links
    # Right: page table of contents.
    - toc.follow
    # Content niceties.
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# analysis.json is a data artifact emitted by the in-app docs-agent, not a page.
# mcp/README.md is a pre-existing guide with links outside docs/; its content is
# covered by the MCP Server page + the MCP Deploy Guide.
exclude_docs: |
  generated/analysis.json
  requirements.txt
  mcp/README.md

